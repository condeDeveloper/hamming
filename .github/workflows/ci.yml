name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: todo erro de um bit e corrigido, no dominio inteiro
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: o que acontece com dois bits trocados
        run: mvn -B -ntp -q exec:java -Dexec.args="duplo"

      - name: a distancia minima medida contra a afirmada
        run: mvn -B -ntp -q exec:java -Dexec.args="distancia"

      - name: quanto custa de bit de paridade
        run: mvn -B -ntp -q exec:java -Dexec.args="custo"

      - name: contra a paridade simples e contra nada
        run: mvn -B -ntp -q exec:java -Dexec.args="comparacao"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
